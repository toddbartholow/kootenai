# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# End-of-life: all open-pull-requests-limit values are set to 0 ahead of
# archiving this repository. Security advisories remain visible via GitHub
# security alerts; version-update PRs are no longer opened.

version: 2
updates:
  # Go modules (API)
  - package-ecosystem: "gomod"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(go)"
    labels:
      - "dependencies"
      - "go"
    reviewers:
      - "toddbartholow"
    groups:
      # Group minor and patch updates together
      go-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"


  # Go modules (Mage build system). Separate module from /api with its own
  # go.mod, so it needs its own entry -- it was unmonitored until a CRITICAL
  # x/crypto/ssh advisory surfaced in it that the /api entry could not see.
  - package-ecosystem: "gomod"
    directory: "/magefiles"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(mage)"
    labels:
      - "dependencies"
      - "go"
  # npm packages (Web)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(npm)"
    labels:
      - "dependencies"
      - "javascript"
    reviewers:
      - "toddbartholow"
    groups:
      # Group Vue-related packages
      vue:
        patterns:
          - "vue*"
          - "@vue/*"
          - "pinia"
          - "vue-router"
      # Group PrimeVue packages
      primevue:
        patterns:
          - "primevue"
          - "@primevue/*"
          - "primeicons"
      # Group dev dependencies
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # npm packages (E2E tests)
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(e2e)"
    labels:
      - "dependencies"
      - "testing"
    reviewers:
      - "toddbartholow"

  # Python dependencies (tools)
  - package-ecosystem: "pip"
    directory: "/tools/labtest"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(python)"
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "toddbartholow"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    reviewers:
      - "toddbartholow"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"
    reviewers:
      - "toddbartholow"

  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"
    reviewers:
      - "toddbartholow"
