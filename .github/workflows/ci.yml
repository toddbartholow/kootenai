name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Four govulncheck findings are Go stdlib issues fixed in 1.25.13
  # (net/http, crypto/tls, html/template, net/url). Keep this in step with
  # the pins in deploy.yml and security-scan.yml.
  GO_VERSION: '1.25.13'
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Backend Go tests and linting
  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'go fmt ./...'"
            gofmt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.1
          working-directory: api
          args: --timeout=5m

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: api/coverage.out
          flags: api
          name: api-coverage
        continue-on-error: true

  # Build API binary to ensure it compiles
  api-build:
    name: API Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Build
        run: go build -v -o bin/labctl ./cmd/labctl

  # Frontend Vue.js tests and linting
  web-test:
    name: Web Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated API types are in sync with swagger.json
        # Fails if src/api/generated/schema.ts is stale relative to the
        # Go backend's swagger spec. Regenerate locally with
        # `npm run generate:api-types` and commit the result.
        run: npm run check:api-types

      - name: Check i18n catalog parity
        # Every locale JSON must have the same leaf keys as en.json.
        # Missing keys silently fall back to English in prod; extra
        # keys are dead weight; type mismatches break $t() resolution.
        run: npm run check:i18n-parity

      - name: Run type check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: web/coverage/coverage-final.json
          flags: web
          name: web-coverage
        continue-on-error: true

  # Pseudo-locale (en-XA) sweep — catches hardcoded English in the UI by
  # rendering with the pseudo catalog and asserting no plain-ASCII text
  # leaks outside vue-i18n. Runs against a self-hosted vite dev server in
  # mock mode so it has no infra dependencies. Routes/skip mechanism live
  # in tests/e2e/tests/pseudo-locale.spec.ts.
  web-i18n-pseudo:
    name: Web i18n Pseudo-locale Sweep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            tests/e2e/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install e2e dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run pseudo-locale sweep
        working-directory: tests/e2e
        run: npm run test:pseudo

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pseudo-locale-report
          path: tests/e2e/playwright-report/
          retention-days: 7

  # Build frontend to ensure it compiles
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_USE_MOCK_DATA: 'false'
          VITE_API_BASE_URL: 'http://localhost:8080'

  # Python template parser: tests and linting.
  #
  # These tests also load every template under templates/, so this job is what
  # keeps the Python parser in step with the Go one. They caught real drift
  # (a stricter Python schema rejecting templates the API accepts) only when
  # run by hand, because nothing ran them in CI.
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: python/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      # black is in the dev extras and configured in pyproject.toml but is not
      # gated here: the tree does not currently satisfy it (~71 lines), and
      # enforcing a second formatter alongside ruff is a separate decision.

      - name: Run tests
        # Runs from python/, but the shipped-template tests reach up to
        # templates/ at the repo root, which checkout provides.
        run: pytest -q

  # The two Python CLIs under tools/. labtest is the E2E harness the README
  # tells people to use, so it failing is the first thing a forker would hit,
  # and neither package's unit suite ran in CI before -- 190 tests between them.
  #
  # Their tests/ directories are ordinary unit tests and need no infrastructure.
  # (labtest/labtest/tests/ is something else: the E2E scenarios the CLI drives
  # against a live deployment. Those are not run here and cannot be.)
  tools-test:
    name: Tooling Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [labtest, sectest]
    defaults:
      run:
        working-directory: tools/${{ matrix.package }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: tools/${{ matrix.package }}/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # ruff is deliberately not gated for these two. Both are configured for
      # it but neither satisfies it today (77 and 39 findings), and the
      # remainder after autofix -- blind except Exception, try/except/pass,
      # long lines -- needs judgement about error handling rather than a
      # mechanical sweep. Gating the tests is the part that carries real
      # signal; cleaning the lint is a separate piece of work.

      - name: Run tests
        run: pytest -q

  # Secret Scanning - prevent credentials from being committed
  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run gitleaks (working tree)
        # Scan the checked-out tree, not commit history: pre-cleanup history
        # is knowingly dirty and is excluded from the public CE repo, which
        # is published with fresh history. The invariant this job enforces
        # is that the CURRENT tree contains no secrets.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks dir --no-banner --redact --exit-code 1 .

  # Go Security Scanning - govulncheck and gosec
  go-security:
    name: Go Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Install security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run gosec
        run: gosec -fmt=text -severity=high -exclude-generated -exclude=G115,G118,G122,G703 ./...
        # Fails on HIGH severity findings; MEDIUM reported but won't fail
        # G115: int overflow false positives on rune conversion
        # G118: intentional context.Background in long-lived goroutines
        # G122: filepath.Walk TOCTOU in admin-only CLI tooling
        # G703: error return value false positives on config file loading

  # JavaScript Security Scanning - npm audit
  js-security:
    name: JavaScript Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  # General security scanning with Trivy
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail on CRITICAL/HIGH findings
          format: 'table'
          skip-dirs: 'docusaurus'

  # Docker build test (ensures Dockerfiles are valid)
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          tags: kootenai-api:test
          load: true  # Load into Docker daemon for scanning
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # `apk upgrade` in the runtime stage is keyed on instruction text,
          # which never changes, so a cache hit silently ships unpatched OS
          # packages. Rebuild that stage every run; the builder stage still caches.
          no-cache-filters: runtime

      - name: Build Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          tags: kootenai-web:test
          load: true  # Load into Docker daemon for scanning
          build-args: |
            VITE_USE_MOCK_DATA=false
            VITE_API_BASE_URL=http://localhost:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # `apk upgrade` in the runtime stage is keyed on instruction text,
          # which never changes, so a cache hit silently ships unpatched OS
          # packages. Rebuild that stage every run; the builder stage still caches.
          no-cache-filters: runtime

      - name: Scan API image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'kootenai-api:test'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail on CRITICAL/HIGH findings
          format: 'table'

      - name: Scan Web image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'kootenai-web:test'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail on CRITICAL/HIGH findings
          format: 'table'
