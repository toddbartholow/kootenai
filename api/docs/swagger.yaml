host: localhost:8080
info:
  contact:
    name: Project repository
    url: https://github.com/toddbartholow/kootenai
  description: |-
    API for the Kootenai cybersecurity education platform
    Orchestrates lab environments across Proxmox and CloudStack
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Kootenai API
  version: "1.0"
paths:
  /activity:
    get:
      consumes:
      - application/json
      description: Get the activity feed for the authenticated user
      parameters:
      - description: 'Maximum number of activity items (default: 20)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_toddbartholow_kootenai_api_internal_dashboard.ActivityData'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/github_com_toddbartholow_kootenai_api_internal_server_dashboards.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_toddbartholow_kootenai_api_internal_server_dashboards.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Activity Feed
      tags:
      - dashboard
  /analytics/time:
    get:
      consumes:
      - application/json
      description: Get time-spent analytics for the authenticated user
      parameters:
      - description: 'Aggregation period (default: month)'
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
