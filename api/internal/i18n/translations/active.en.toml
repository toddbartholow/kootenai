[labctl.pod.hints.resetVm]
other = "Usage: labctl pod reset-vm <pod-id> <vm-name> [--snapshot=<name>]"

[labctl.snapshot.usage]
other = """Snapshot management commands

Usage:
  labctl snapshot <command> [options]

Commands:
  list        List all snapshots for a VM
  create      Create a new snapshot
  revert      Revert VM to a snapshot
  delete      Delete a snapshot

Options (for all commands):
  --pod       Pod ID (required)
  --vm        VM name (required)

Options (for create):
  --name      Snapshot name (required)
  --desc      Snapshot description
  --ram       Include RAM state in snapshot

Options (for revert/delete):
  --name      Snapshot name (required)

Examples:
  labctl snapshot list --pod pod-123 --vm ubuntu-desktop
  labctl snapshot create --pod pod-123 --vm ubuntu-desktop --name checkpoint1 --desc "Initial state"
  labctl snapshot revert --pod pod-123 --vm ubuntu-desktop --name checkpoint1
  labctl snapshot delete --pod pod-123 --vm ubuntu-desktop --name checkpoint1"""

