Usage:
  labctl session <command> [options]

Commands:
  list        List all sessions
  start       Start a new session
  status      Show detailed session status
  progress    Show progress bar and summary
  checkpoints List checkpoint details
  end         End a session

Examples:
  labctl session list
  labctl session list --active
