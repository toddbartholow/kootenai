[labctl.lab.usage]
other = """Lab template management commands

Usage:
  labctl lab <command> [options]

Commands:
  list        List available lab templates
  show        Show detailed template information
  validate    Validate a lab template file

Examples:
  labctl lab list
  labctl lab show security-onion-basics
  labctl lab validate templates/new-lab.yaml"""

[labctl.lab.hints.show]
other = "Usage: labctl lab show <template-name>"

[labctl.lab.hints.validate]
other = "Usage: labctl lab validate <template-file>"

[labctl.pod.usage]
other = """Pod management commands

Usage:
  labctl pod <command> [options]

Commands:
  list        List all pods
  create      Create a new pod from template
  status      Show detailed pod status
  destroy     Destroy a pod
  reset       Reset pod to snapshot
  reset-vm    Reset a specific VM in a pod

Examples:
  labctl pod list
  labctl pod list --owner=student@example.com
  labctl pod create --template=security-onion-basics --owner=student@example.com
  labctl pod status abc123
  labctl pod destroy abc123
  labctl pod reset abc123 --snapshot=initial"""

[labctl.pod.hints.create]
other = "Usage: labctl pod create --template=<name> --owner=<owner> [--duration=4h]"

