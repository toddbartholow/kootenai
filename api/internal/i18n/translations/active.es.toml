# Spanish (es) message catalog.
#
# Draft quality: machine-translated following the conventions in
# docs/i18n/glossary.md, then lightly edited for consistency. Strings here
# should be reviewed by a native-speaker Spanish SME with virtualization
# and/or cyber-ed background before we advertise `es` publicly.
#
# Validation messages deliberately avoid gendered adjectives agreeing with
# {{.Field}}: {{.Field}} is interpolated as a bare field name with no
# article, which makes "debe ser válido/a" ambiguous. We use noun-phrase
# constructions ("campo obligatorio", "formato no válido") instead — they
# read naturally regardless of the underlying field's grammatical gender.

