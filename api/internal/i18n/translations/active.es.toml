# --- Ayuda de subcomandos de labctl y sugerencias ---
# Los bloques Usage son texto de ayuda multilínea y se mantienen como
# una sola clave para que los traductores reciban el bloque completo
# como unidad; los tokens de comando/flag NO se traducen (son las
# cadenas literales que el operador escribe).

[labctl.lab.usage]
other = """Comandos de gestión de plantillas de laboratorio

Uso:
  labctl lab <comando> [opciones]

Comandos:
  list        Lista las plantillas de laboratorio disponibles
  show        Muestra información detallada de una plantilla
  validate    Valida un archivo de plantilla de laboratorio

Ejemplos:
  labctl lab list
  labctl lab show security-onion-basics
  labctl lab validate templates/new-lab.yaml"""

[labctl.lab.hints.show]
other = "Uso: labctl lab show <nombre-plantilla>"

[labctl.lab.hints.validate]
other = "Uso: labctl lab validate <archivo-plantilla>"

[labctl.pod.usage]
other = """Comandos de gestión de pods

Uso:
  labctl pod <comando> [opciones]

Comandos:
  list        Lista todos los pods
  create      Crea un nuevo pod desde una plantilla
  status      Muestra el estado detallado del pod
  destroy     Destruye un pod
  reset       Restablece el pod a una instantánea
  reset-vm    Restablece una VM específica dentro del pod

Ejemplos:
  labctl pod list
  labctl pod list --owner=student@example.com
  labctl pod create --template=security-onion-basics --owner=student@example.com
  labctl pod status abc123
  labctl pod destroy abc123
  labctl pod reset abc123 --snapshot=initial"""

[labctl.pod.hints.create]
other = "Uso: labctl pod create --template=<nombre> --owner=<propietario> [--duration=4h]"

[labctl.pod.hints.status]
other = "Uso: labctl pod status <id-pod>"

[labctl.pod.hints.destroy]
other = "Uso: labctl pod destroy <id-pod> [--force]"

[labctl.pod.hints.reset]
other = "Uso: labctl pod reset <id-pod> [--snapshot=<nombre>]"

[labctl.pod.hints.resetVm]
other = "Uso: labctl pod reset-vm <id-pod> <nombre-vm> [--snapshot=<nombre>]"

[labctl.snapshot.usage]
other = """Comandos de gestión de instantáneas

Uso:
  labctl snapshot <comando> [opciones]

Comandos:
  list        Lista todas las instantáneas de una VM
  create      Crea una nueva instantánea
  revert      Revierte la VM a una instantánea
  delete      Elimina una instantánea

Opciones (para todos los comandos):
  --pod       ID del pod (obligatorio)
  --vm        Nombre de la VM (obligatorio)

Opciones (para create):
  --name      Nombre de la instantánea (obligatorio)
  --desc      Descripción de la instantánea
  --ram       Incluir estado de RAM en la instantánea

Opciones (para revert/delete):
  --name      Nombre de la instantánea (obligatorio)

Ejemplos:
  labctl snapshot list --pod pod-123 --vm ubuntu-desktop
  labctl snapshot create --pod pod-123 --vm ubuntu-desktop --name checkpoint1 --desc "Estado inicial"
  labctl snapshot revert --pod pod-123 --vm ubuntu-desktop --name checkpoint1
  labctl snapshot delete --pod pod-123 --vm ubuntu-desktop --name checkpoint1"""

[labctl.snapshot.errors.podVmRequired]
other = "Error: --pod y --vm son obligatorios"

[labctl.snapshot.errors.podVmNameRequired]
other = "Error: --pod, --vm y --name son obligatorios"

[labctl.session.usage]
other = """Comandos de gestión de sesiones de laboratorio

Uso:
  labctl session <comando> [opciones]

Comandos:
  list        Lista todas las sesiones
  start       Inicia una nueva sesión
  status      Muestra el estado detallado de la sesión
  progress    Muestra la barra y el resumen de progreso
  checkpoints Lista los detalles de los puntos de control
  end         Finaliza una sesión

Ejemplos:
  labctl session list
  labctl session list --active
  labctl session start --pod=abc123 --user=student@example.com --template=security-onion-basics
  labctl session status abc123
  labctl session progress abc123
  labctl session checkpoints abc123
  labctl session end abc123"""

[labctl.session.hints.start]
other = "Uso: labctl session start --pod=<id> --user=<id> --template=<nombre>"

[labctl.session.hints.status]
other = "Uso: labctl session status <id-sesión>"

[labctl.session.hints.progress]
other = "Uso: labctl session progress <id-sesión>"

[labctl.session.hints.checkpoints]
other = "Uso: labctl session checkpoints <id-sesión>"

