<!--
  Wazuh Manager Integration Configuration for Kootenai

  This file configures the Wazuh integrator module to send alerts
  to the Kootenai API webhook endpoint.

  Place this file in /var/ossec/etc/ossec.conf on the Wazuh Manager
  inside the <ossec_config> section.
-->

<!-- Kootenai Integration -->
<integration>
  <name>custom-kootenai</name>
  <hook_url>http://KOOTENAI_API_HOST:8080/api/v1/events/wazuh</hook_url>
  <level>3</level>
  <alert_format>json</alert_format>
  <options>{"timeout": 10}</options>
</integration>

