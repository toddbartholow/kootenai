# Grafana Dashboard Provisioning
# This configures where to load dashboards from

apiVersion: 1

providers:
  - name: 'Kootenai'
    orgId: 1
    folder: ''
    folderUid: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
