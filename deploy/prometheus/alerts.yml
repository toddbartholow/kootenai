# Prometheus Alert Rules for Kootenai Platform
#
# These alerts cover critical paths for production monitoring.

groups:
  - name: kootenai-api
    interval: 30s
    rules:
      # API High Error Rate
      - alert: APIHighErrorRate
        expr: |
          (
            sum(rate(labctl_http_responses_by_code_total{code=~"5.."}[5m]))
            /
            sum(rate(labctl_http_responses_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate detected"
          description: "API error rate is {{ $value | humanizePercentage }} (> 5%) over the last 5 minutes"

      # API High Latency
      - alert: APIHighLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(labctl_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "API p99 latency is {{ $value | humanizeDuration }} (> 2s)"

      # API Down
      - alert: APIDown
        expr: up{job="kootenai-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kootenai API is down"
          description: "The API server has been unreachable for more than 2 minutes"

