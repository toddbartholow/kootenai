# Prometheus Configuration for Kootenai Platform
#
# This configuration scrapes the API server. The NATS job is disabled — see below.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration (optional - enable when alertmanager is deployed)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load alert rules
rule_files:
  - /etc/prometheus/alerts.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Kootenai API Server
  - job_name: 'kootenai-api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    # If you set METRICS_TOKEN in .env, /metrics starts requiring a bearer
    # token and this job must send the same one. Prometheus does NOT read
    # environment variables from its config file, so the value has to be
    # written here literally (or into a file referenced by authorization.
    # credentials_file). Setting METRICS_TOKEN without doing this makes every
    # scrape 401, which takes the API target down and fires APIDown.
    # authorization:
    #   type: Bearer
    #   credentials: <the same value as METRICS_TOKEN>

  # NATS Server Metrics — DISABLED.
  #
  # nats:8222/varz serves JSON, not the Prometheus text format, so this job
  # fails to parse on every scrape. Left enabled it makes up{job="nats"} == 0
  # permanently, which fires the NATSDown critical alert about two minutes
  # after a stock `docker compose up`.
  #
  # To enable: add prometheus-nats-exporter to docker-compose.yml, point this
  # job at it (default :7777, metrics_path /metrics), and re-enable the
  # NATSDown rule in alerts.yml. NATS's own /healthz is already used as the
  # container healthcheck, so liveness is covered without this.
  # - job_name: 'nats'
  #   static_configs:
  #     - targets: ['nats-exporter:7777']
  #   scrape_interval: 30s

  # PostgreSQL Metrics (if postgres_exporter is added later)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
