# =============================================================================
# Development Tools (run with: docker compose --profile tools up -d)
# =============================================================================
  adminer:
    image: adminer:latest
    container_name: labctl-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    profiles:
      - tools

volumes:
  postgres_data:
    name: labctl_postgres_data
  nats_data:
    name: labctl_nats_data

networks:
  default:
    name: labctl_network
