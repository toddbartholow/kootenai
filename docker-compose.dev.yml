# Kootenai Platform - Docker Compose
#
# This file provides the infrastructure services needed for local development.
# For production deployment, see deploy/docker-compose.yml
#
# Quick Start:
#   1. Copy deploy/.env.example to .env and adjust if needed
#      (there is no repo-root .env.example)
#   2. Start services: docker compose up -d
#   3. Run the API:    cd api && go run ./cmd/labctl serve
#   4. Run the web UI: cd web && npm run dev
#
# Commands:
#   docker compose up -d          # Start PostgreSQL and NATS
#   docker compose down           # Stop services
#   docker compose logs -f        # View logs
#   docker compose down -v        # Stop and DELETE all data

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: labctl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-labctl}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-<DB_PASSWORD>}
      POSTGRES_DB: ${DATABASE_NAME:-labctl}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-labctl} -d ${DATABASE_NAME:-labctl}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # NATS with JetStream (Message Queue & Event Streaming)
  # ============================================================================
  nats:
    image: nats:2.10-alpine
    container_name: labctl-nats
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"      # Client connections
      - "${NATS_HTTP_PORT:-8222}:8222" # HTTP monitoring
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

