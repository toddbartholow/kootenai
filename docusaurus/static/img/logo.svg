<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Beaker/Flask shape -->
  <path d="M70 30 L70 80 L40 140 Q30 160 50 170 L150 170 Q170 160 160 140 L130 80 L130 30"
        fill="none" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Beaker top rim -->
  <path d="M60 30 L140 30" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round"/>
  <!-- Network nodes inside beaker -->
  <circle cx="80" cy="120" r="8" fill="#4f46e5"/>
  <circle cx="120" cy="130" r="8" fill="#6366f1"/>
  <circle cx="100" cy="100" r="8" fill="#818cf8"/>
  <!-- Network connections -->
  <line x1="80" y1="120" x2="100" y2="100" stroke="#a5b4fc" stroke-width="3"/>
  <line x1="100" y1="100" x2="120" y2="130" stroke="#a5b4fc" stroke-width="3"/>
  <line x1="80" y1="120" x2="120" y2="130" stroke="#a5b4fc" stroke-width="3"/>
  <!-- Bubbles -->
  <circle cx="90" cy="145" r="4" fill="#c7d2fe"/>
  <circle cx="110" cy="150" r="3" fill="#c7d2fe"/>
</svg>
