<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.1" stroke="#818cf8" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo beaker (scaled down) -->
  <g transform="translate(100, 180) scale(1.5)">
    <path d="M70 30 L70 80 L40 140 Q30 160 50 170 L150 170 Q170 160 160 140 L130 80 L130 30"
          fill="none" stroke="url(#logoGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 30 L140 30" stroke="url(#logoGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="80" cy="120" r="6" fill="#6366f1"/>
    <circle cx="120" cy="130" r="6" fill="#818cf8"/>
    <circle cx="100" cy="100" r="6" fill="#a5b4fc"/>
    <line x1="80" y1="120" x2="100" y2="100" stroke="#c7d2fe" stroke-width="2"/>
    <line x1="100" y1="100" x2="120" y2="130" stroke="#c7d2fe" stroke-width="2"/>
    <line x1="80" y1="120" x2="120" y2="130" stroke="#c7d2fe" stroke-width="2"/>
    <circle cx="90" cy="145" r="3" fill="#e0e7ff"/>
    <circle cx="110" cy="150" r="2" fill="#e0e7ff"/>
  </g>

  <!-- Title -->
  <text x="450" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">Kootenai</text>
  <text x="450" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#818cf8">Platform</text>

  <!-- Tagline -->
  <text x="450" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a5b4fc">Cybersecurity &amp; Network Operations Education</text>

  <!-- Features -->
  <text x="450" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#c7d2fe">Proxmox • CloudStack • Canvas LMS • Real-time Progress</text>
</svg>
