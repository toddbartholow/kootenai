[project]
name = "kootenai-python"
version = "0.1.0"
description = "Python utilities for Kootenai platform (template parsing, automation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "python-dotenv>=1.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab_templates"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    # UP042 wants `class X(str, Enum)` rewritten as `enum.StrEnum`. The two are
    # not interchangeable: StrEnum's __str__ returns the value, so
    # f"{Platform.PROXMOX}" would change from "Platform.PROXMOX" to "proxmox".
    # No benefit here worth that risk -- the code reads `.value` explicitly.
    "UP042",
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
