apiVersion: v1
kind: LabTemplate
metadata:
  name: Active Directory Fundamentals
  description: |
    Learn the fundamentals of Windows Active Directory. This lab covers AD
    structure, creating organizational units, user and group management,
    and basic administration using both GUI and PowerShell.
  duration: 120m
  difficulty: beginner
  tags:
    - windows
    - active-directory
    - administration
    - powershell
    - identity
  version: "1.0.0"
  author: Kootenai Team
  category: windows-ad

spec:
  platform: proxmox

  network:
    segments:
      - name: ad-network
        vlan: 300
        subnet: 10.30.0.0/24
        gateway: 10.30.0.1
        dhcp: false

  vms:
    - name: dc01
      template: windows-server-2022
      wazuhAgent: true
      agentConfig:
        monitor_paths:
          - C:\Windows\System32\winevt\Logs
          - C:\Users
        audit_commands: true
        realtime: true
      resources:
        cpu: 4
        memory: 8192
        disk: 80
      networks:
        - segment: ad-network
          ip: 10.30.0.10
      snapshots:
        - name: fresh-install
          description: Windows Server with AD DS role ready to configure
          default: true

    - name: workstation01
      template: windows-10-enterprise
      wazuhAgent: true
      resources:
        cpu: 2
        memory: 4096
        disk: 60
      networks:
        - segment: ad-network
          ip: 10.30.0.100
      snapshots:
        - name: ready-to-join
          description: Windows 10 ready to join domain
          default: true

  checkpoints:
    enabled: true
    pass_threshold: 70
    allow_retry: true
    show_hints: true
    realtime_update: true

  objectives:
    - id: promote-dc
      description: Promote the server to a Domain Controller
      points: 20
      hint: "Use Server Manager or Install-ADDSForest PowerShell cmdlet"
      order: 1
      triggers:
        - type: command_executed
          target: dc01
          match:
            pattern: "Install-ADDSForest|dcpromo"

    - id: create-ou
      description: Create organizational units for Users, Computers, and Groups
      points: 15
      hint: "Use Active Directory Users and Computers or New-ADOrganizationalUnit"
      order: 2
      triggers:
        - type: command_executed
          target: dc01
          match:
            pattern: "New-ADOrganizationalUnit"

    - id: create-users
      description: Create at least 3 user accounts in the Users OU
      points: 15
      hint: "Use New-ADUser cmdlet or AD Users and Computers GUI"
      order: 3
      triggers:
        - type: command_executed
          target: dc01
          match:
            pattern: "New-ADUser"

    - id: create-groups
      description: Create security groups for IT, HR, and Finance departments
      points: 10
      hint: "Use New-ADGroup cmdlet to create security groups"
      order: 4
      triggers:
        - type: command_executed
          target: dc01
          match:
            pattern: "New-ADGroup"

    - id: add-group-members
      description: Add users to their respective department groups
      points: 10
      hint: "Use Add-ADGroupMember cmdlet"
      order: 5
      triggers:
        - type: command_executed
          target: dc01
          match:
            pattern: "Add-ADGroupMember"

    - id: join-domain
      description: Join the Windows 10 workstation to the domain
      points: 15
      hint: "Use Add-Computer cmdlet or System Properties GUI"
      order: 6
      triggers:
        - type: command_executed
          target: workstation01
          match:
            pattern: "Add-Computer"

    - id: domain-login
      description: Log in to the workstation with a domain user account
      points: 15
      hint: "Use domain\\username format to log in"
      order: 7
      triggers:
        - type: command_executed
          target: workstation01
          match:
            pattern: "whoami.*lab\\\\|query user"
